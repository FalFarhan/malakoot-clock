<style>*{box-sizing:border-box}html,body{color:#eef1f5;background:#1a1d23;height:100%;margin:0;font-family:Segoe UI,Roboto,Noto Sans Arabic,Tahoma,sans-serif;overflow:hidden}#stage{background:#1a1d23;position:fixed;inset:0}#stage canvas{width:100%;height:100%;display:block;position:absolute;inset:0}#gl{pointer-events:none}#face{touch-action:none}#hud{z-index:3;inset-inline:8px;pointer-events:none;justify-content:space-between;align-items:flex-end;gap:8px;display:flex;position:fixed;bottom:8px}#clock{--glass-bg:linear-gradient(165deg, #ffffff2e 0%, #ffffff0f 42%, #14161c47 100%);--glass-fill:#1c1f268c;background:var(--glass-bg), var(--glass-fill);-webkit-backdrop-filter:blur(20px)saturate(1.6);backdrop-filter:blur(20px)saturate(1.6);pointer-events:none;border:1px solid #ffffff47;border-radius:12px;min-width:7.5em;padding:4px 10px 5px;box-shadow:inset 0 1px #ffffff6b,0 8px 24px #00000047}#clock .t{font-variant-numeric:tabular-nums;letter-spacing:.04em;text-align:start;direction:ltr;font-size:18px;font-weight:600;line-height:1.2}#clock .p{color:#c5ccd6;margin-top:1px;font-size:10px;line-height:1.3}#open{pointer-events:auto;color:#eef1f5;--glass-bg:linear-gradient(165deg, #ffffff2e 0%, #ffffff0f 42%, #14161c47 100%);--glass-fill:#1c1f268c;background:var(--glass-bg), var(--glass-fill);-webkit-backdrop-filter:blur(20px)saturate(1.6);backdrop-filter:blur(20px)saturate(1.6);text-align:center;white-space:nowrap;border:1px solid #ffffff47;border-radius:999px;flex-direction:column;gap:1px;max-width:58%;padding:6px 10px;font-size:11px;line-height:1.35;text-decoration:none;display:flex;overflow:hidden;box-shadow:inset 0 1px #ffffff6b,0 8px 24px #00000047}#open .en{color:#c5ccd6;direction:ltr;font-size:10px}#open:hover{border-color:#ffffff80}@media (width<=420px){#clock .t{font-size:15px}#open{padding:5px 8px;font-size:10px}#open .en{font-size:9px}}</style>

<main id="stage">
  <canvas id="gl"></canvas>
  <canvas id="face" aria-label="ساعة ملكوت — Malakoot Clock"></canvas>
